name: Deploy worker

# Deploys the Worker (API + static site) whenever web/ changes on main.
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an API token with the "Edit Cloudflare Workers" template plus D1 edit
#   CLOUDFLARE_ACCOUNT_ID - from the Workers & Pages overview page in the dashboard
# The D1 database must already exist and its id must be in web/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Deploy
        run: npx wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
